{% extends 'base.html' %}

{% block title %}删除作者 - 图书管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">确认删除</h4>
            </div>
            <div class="card-body">
                <p class="lead">您确定要删除作者「{{ author.name }}」吗？</p>
                <p class="text-muted">此操作不可撤销，该作者的图书将变为未知作者状态。</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger">确认删除</button>
                        <a href="{% url 'books:author_list' %}" class="btn btn-outline-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
